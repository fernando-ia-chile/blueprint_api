# Pipeline de referencia del blueprint. Ajustar las 'service connections' y 'variable groups'
# (enlazados a Key Vault) antes de usar en un proyecto real.

trigger:
  branches:
    include:
      - main
      - 'release/*'

variables:
  buildConfiguration: 'Release'
  dotnetSdk: '10.0.x'
  solution: 'ApiBlueprint.sln'
  apiProject: 'AIEP.Application.Api.Blueprint/AIEP.Application.Api.Blueprint.csproj'
  imageRepository: 'aiep/blueprint'
  dockerRegistryServiceConnection: '<ACR-service-connection>'   # placeholder
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: 'Build, test y publish'
    jobs:
      - job: BuildTest
        pool:
          vmImage: $(vmImage)
        steps:
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetSdk)'

          - script: dotnet restore $(solution)
            displayName: 'Restore'

          - script: dotnet build $(solution) -c $(buildConfiguration) --no-restore
            displayName: 'Build'

          - script: >
              dotnet test $(solution) -c $(buildConfiguration) --no-build
              --collect:"XPlat Code Coverage"
              --logger trx
              --results-directory $(Agent.TempDirectory)/tests
            displayName: 'Test'

          - task: PublishTestResults@2
            displayName: 'Publicar resultados de pruebas'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/tests/**/*.trx'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar cobertura'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/tests/**/coverage.cobertura.xml'

          - script: >
              dotnet publish $(apiProject) -c $(buildConfiguration) --no-build
              -o $(Build.ArtifactStagingDirectory)/app
            displayName: 'Publish'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefacto webapi'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/app'
              artifact: 'webapi'

  - stage: Docker
    displayName: 'Build & push imagen'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: BuildPush
        pool:
          vmImage: $(vmImage)
        steps:
          - task: Docker@2
            displayName: 'Build y push de la imagen'
            inputs:
              command: 'buildAndPush'
              repository: '$(imageRepository)'
              dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(Build.BuildId)
                latest

